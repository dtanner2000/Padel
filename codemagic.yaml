# PADEL: OFF THE GLASS — Codemagic CI (Godot 4.6)
# Modelled on the Jetpack Attack pipeline (dtanner2000/JPA), which already ships to TestFlight.
#
#   ios-testflight : Godot exports the Xcode project on a cloud Mac → signed IPA → TestFlight
#   android-apk    : signed release APK to sideload for playtesting (no Gradle, no plugins)
#   android-play   : signed AAB for Google Play (Gradle, with AdMob + Play Billing)
#
# BEFORE FIRST BUILD (one-time, in the Codemagic web UI, on the *Padel* app):
#   1. Integration: reuses the team-level App Store Connect key "JPA ASC Key" (already set up
#      for Jetpack Attack, works for every app on the team). Nothing to add.
#   2. App > Environment variables: create group "apple" with CERTIFICATE_PRIVATE_KEY (Secure),
#      the same RSA private key Jetpack Attack's "apple" group uses. Environment groups are
#      per app, so it has to be added again here. If you no longer have that key, generate a
#      fresh one:  ssh-keygen -t rsa -b 2048 -m PEM -f padel_cert_key -q -N ""
#      and paste padel_cert_key's contents. fetch-signing-files --create then makes a new
#      distribution certificate (Apple allows a few per team).
#   3. Android only: Code signing identities > Android keystores > reference "padel_keystore"
#      (or change it below to jpa_keystore to sideload-test with the JPA key).
#
# Identifiers: bundle/package com.davidtanner.padel · App Store Connect Apple ID 6838439193 ·
# Team 3YB9G94LWA (in export_presets.cfg).

workflows:
  ios-testflight:
    name: iOS -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: JPA ASC Key

    cache:
      cache_paths:
        - $CM_BUILD_DIR/.godot   # imported assets: faster rebuilds

    environment:
      xcode: latest
      groups:
        - apple
      vars:
        GODOT_VERSION: 4.6.3-stable
        GODOT_URL: https://github.com/godotengine/godot-builds/releases/download
        GODOT: /Users/builder/Downloads/Godot.app/Contents/MacOS/Godot
        BUNDLE_ID: com.davidtanner.padel

    scripts:
      # Fetch-or-create the App Store signing files on the builder (same as JPA).
      - name: Fetch signing files
        script: |
          set -e
          # Game Center must be on the App ID, and the profile must have been
          # made after it was switched on: stale profiles are deleted and remade.
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json | jq -r '.[0].id')
          echo "Bundle id resource: $BID"
          app-store-connect bundle-ids enable-capabilities "$BID" --capability GAME_CENTER || echo "(Game Center already on)"
          fetch() {
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --platform IOS \
              --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
              --create
          }
          fetch
          STALE=0
          # newer Xcode keeps profiles in UserData; older in MobileDevice: check both
          for f in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision \
                   "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            [ -e "$f" ] || continue
            security cms -D -i "$f" > /tmp/p.plist
            echo "Profile: $f"
            /usr/libexec/PlistBuddy -c "Print Entitlements" /tmp/p.plist | grep -iE "game-center|application-identifier" || true
            if grep -q "$BUNDLE_ID" /tmp/p.plist && ! grep -q "com.apple.developer.game-center" /tmp/p.plist; then
              UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /tmp/p.plist)
              echo "Profile $UUID has no Game Center: deleting it"
              for PID in $(app-store-connect profiles list --bundle-id-resource-id "$BID" --json | jq -r --arg u "$UUID" '.[] | select(.attributes.uuid == $u) | .id'); do
                app-store-connect profiles delete "$PID"
              done
              rm -f "$f"
              STALE=1
            fi
          done
          if [ "$STALE" = 1 ]; then fetch; fi
          keychain initialize
          keychain add-certificates

      - name: Install Godot + export templates
        working_directory: /Users/builder/Downloads
        script: |
          set -e
          curl -fsSL "$GODOT_URL/$GODOT_VERSION/Godot_v${GODOT_VERSION}_macos.universal.zip" -o godot.zip
          unzip -q godot.zip && rm godot.zip
          "$GODOT" --version
          curl -fsSL "$GODOT_URL/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz" -o tpl.tpz
          unzip -q tpl.tpz && rm tpl.tpz
          TVER=$(echo "$GODOT_VERSION" | sed 's/-/./')
          DEST="$HOME/Library/Application Support/Godot/export_templates/$TVER"
          mkdir -p "$DEST" && mv templates/* "$DEST"/
          test -f "$DEST/ios.zip" || { echo "FATAL: ios.zip missing from templates"; exit 1; }

      # Game Center + StoreKit (rating prompt, later purchases): GodotApplePlugins
      # (GameCenter, StoreKit and the Swift runtime they need).
      # Too big for the repo (~300 MB), so it's fetched per build at a pinned release.
      - name: Fetch Game Center plugin
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          REL=a66f619a253cbc39922ff9018b2307b6ec6862cc
          curl -fsSL "https://github.com/xibbon/GodotApplePlugins/releases/download/build-$REL/GodotApplePlugins-addons-$REL.zip" -o gap.zip
          unzip -q gap.zip -d gap && rm gap.zip
          mkdir -p addons
          for p in GodotApplePluginsGameCenter GodotApplePluginsStoreKit GodotApplePluginsRuntime; do
            rm -rf "addons/$p" && cp -R "gap/dist/addons/$p" addons/
          done
          rm -rf gap addons/*/bin/*.dSYM
          ls addons/GodotApplePluginsGameCenter/bin addons/GodotApplePluginsStoreKit/bin addons/GodotApplePluginsRuntime/bin

      - name: Set build number + import resources
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          # Apple needs a strictly increasing CFBundleVersion per upload.
          sed -i '' "s|^application/version=\"[^\"]*\"|application/version=\"$PROJECT_BUILD_NUMBER\"|" export_presets.cfg
          grep -E "^application/(version|short_version|bundle_identifier|app_store_team_id)=" export_presets.cfg
          # (the first import also lets the AdMob plugin download its iOS binaries)
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --import || true
          ls addons/admob/ios/bin/ads/libs || { echo "FATAL: AdMob iOS binaries missing"; exit 1; }

      - name: Godot export (Xcode project)
        script: |
          set -e
          sudo xcode-select -switch /Applications/Xcode.app
          cd "$CM_BUILD_DIR"
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" build/ios/Padel.ipa > export.log 2>&1 || true
          sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' export.log | tail -80
          test -d build/ios/Padel.xcodeproj || { echo "FATAL: xcodeproj was not generated"; exit 1; }
          # link Google's AdMob / UMP Swift packages (the plugin's own step is deferred and skipped headless)
          ls build/ios/admob_spm
          "$GODOT" --headless --path . -s tools/admob_spm_patch.gd -- build/ios/Padel.xcodeproj/project.pbxproj
          xcodebuild -list -project build/ios/Padel.xcodeproj

      - name: Sign + build IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles
          xcode-project build-ipa --project build/ios/Padel.xcodeproj --scheme Padel || {
            # print the real Xcode errors (the default log only says "Failed to archive")
            L=$(ls -t /tmp/xcodebuild_logs/*.log | head -1)
            echo "=== errors from $L ==="
            grep -nE "error:|Provisioning profile|entitlement|Undefined symbol|ld: " "$L" | head -60
            echo "=== last 80 lines ==="
            tail -80 "$L"
            exit 1
          }

    artifacts:
      - build/ios/ipa/*.ipa
      - export.log
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Internal testers get processed builds automatically; set true when you add
        # EXTERNAL testers (triggers Apple's beta review).
        submit_to_testflight: false

  # ── ANDROID → signed APK for sideload playtesting ──────────────────────────────────────────
  # Same shape as JPA's Amazon workflow: stock export template, no Gradle, no plugins, on the Mac
  # instance (linux_x2 isn't on this billing plan; the macOS image has the Android SDK and JDK).
  # Google Play needs an AAB via Gradle later; see JPA's android-play workflow for that pattern.
  android-apk:
    name: Android -> signed APK
    max_build_duration: 45
    instance_type: mac_mini_m2

    cache:
      cache_paths:
        - $CM_BUILD_DIR/.godot

    environment:
      android_signing:
        - padel_keystore
      vars:
        GODOT_VERSION: 4.6.3-stable
        GODOT_URL: https://github.com/godotengine/godot-builds/releases/download
        GODOT: /Users/builder/Downloads/Godot.app/Contents/MacOS/Godot
        PRESET: Android
        OUT: build/android/Padel.apk

    scripts:
      - name: Install Godot + export templates
        working_directory: /Users/builder/Downloads
        script: |
          set -e
          curl -fsSL "$GODOT_URL/$GODOT_VERSION/Godot_v${GODOT_VERSION}_macos.universal.zip" -o godot.zip
          unzip -q godot.zip && rm godot.zip
          "$GODOT" --version
          curl -fsSL "$GODOT_URL/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz" -o tpl.tpz
          unzip -q tpl.tpz && rm tpl.tpz
          TVER=$(echo "$GODOT_VERSION" | sed 's/-/./')
          DEST="$HOME/Library/Application Support/Godot/export_templates/$TVER"
          mkdir -p "$DEST" && mv templates/* "$DEST"/
          test -f "$DEST/android_release.apk" \
            || { echo "FATAL: android_release.apk missing from templates"; exit 1; }

      # Headless Godot finds the SDK through EDITOR SETTINGS, not the environment.
      - name: Point Godot at the Android SDK
        script: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK" || { echo "FATAL: no Android SDK on this builder"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$CM_ENV"
          JH=$(/usr/libexec/java_home -v 17 2>/dev/null || echo "${JAVA_HOME:-}")
          DIR="$HOME/Library/Application Support/Godot"
          mkdir -p "$DIR"
          for ES in "$DIR/editor_settings-4.tres" "$DIR/editor_settings-4.6.tres"; do
            {
              printf '%s\n' '[gd_resource type="EditorSettings" format=3]'
              printf '\n'
              printf '%s\n' '[resource]'
              printf 'export/android/android_sdk_path = "%s"\n' "$SDK"
              printf 'export/android/java_sdk_path = "%s"\n' "$JH"
            } > "$ES"
          done
          cat "$DIR/editor_settings-4.6.tres"

      - name: Wire the release keystore
        script: |
          set -e
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "FATAL: no keystore. Codemagic > Code signing identities > Android keystores,"
            echo "       reference name 'padel_keystore'."
            exit 1
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$CM_KEYSTORE_PATH" >> "$CM_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$CM_KEY_ALIAS" >> "$CM_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$CM_KEY_PASSWORD" >> "$CM_ENV"

      - name: Set version code + import resources
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          sed -i '' "s|^version/code=.*|version/code=$PROJECT_BUILD_NUMBER|" export_presets.cfg
          grep -E "^(version/code|version/name|package/unique_name)=" export_presets.cfg
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --import || true

      - name: Godot export (APK)
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          mkdir -p build/android
          "$GODOT" --headless --path . --export-release "$PRESET" "$OUT" > export.log 2>&1 || true
          sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' export.log | tail -80
          test -f "$OUT" || { echo "FATAL: no APK produced"; exit 1; }
          echo "--- APK size: $(( $(stat -f%z "$OUT") / 1024 / 1024 )) MB"

    artifacts:
      - build/android/*.apk
      - export.log

  # ── ANDROID → Google Play (AAB, with AdMob + Play Billing) ─────────────────────────────────
  # Proven pattern from JPA's android-play workflow. Play needs an AAB, and Godot only makes one
  # through a GRADLE build; the AdMob and GodotIap addons only link their Android libraries
  # (EditorExportPlugin _get_android_libraries / _get_android_dependencies) in a Gradle build.
  # Upload key: the team's jpa_keystore (Play App Signing re-signs with its own app key, and one
  # upload key may serve several apps). Swap in a padel-specific keystore here if you make one.
  android-play:
    name: Android -> Google Play (AAB)
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - jpa_keystore
      vars:
        GODOT_VERSION: 4.6.3-stable
        GODOT_URL: https://github.com/godotengine/godot-builds/releases/download
        GODOT: /Users/builder/Downloads/Godot.app/Contents/MacOS/Godot
        PRESET: Android Play
        OUT: build/padel-play.aab

    cache:
      cache_paths:
        - $CM_BUILD_DIR/.godot
        - $HOME/.gradle

    scripts:
      - name: Install Godot + export templates
        working_directory: /Users/builder/Downloads
        script: |
          set -e
          curl -fsSL "$GODOT_URL/$GODOT_VERSION/Godot_v${GODOT_VERSION}_macos.universal.zip" -o godot.zip
          unzip -q godot.zip && rm godot.zip
          "$GODOT" --version
          curl -fsSL "$GODOT_URL/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz" -o tpl.tpz
          unzip -q tpl.tpz && rm tpl.tpz
          TVER=$(echo "$GODOT_VERSION" | sed 's/-/./')
          DEST="$HOME/Library/Application Support/Godot/export_templates/$TVER"
          mkdir -p "$DEST" && mv templates/* "$DEST"/
          echo "TVER=$TVER" >> "$CM_ENV"
          echo "TPL_DEST=$DEST" >> "$CM_ENV"
          test -f "$DEST/android_source.zip" \
            || { echo "FATAL: android_source.zip missing — cannot do a Gradle build."; exit 1; }

      # Project > Install Android Build Template has no headless equivalent (godotengine/godot#38327);
      # this reproduces exactly what the editor does (see JPA's workflow for the derivation).
      - name: Install the Android build template
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          rm -rf android
          mkdir -p android/build
          printf '%s\n' "$TVER" > android/.build_version
          printf '\n' > android/build/.gdignore
          unzip -q -o "$TPL_DEST/android_source.zip" -d android/build
          test -f android/build/build.gradle || { echo "FATAL: android_source.zip did not unpack"; ls -la android/build; exit 1; }
          chmod +x android/build/gradlew 2>/dev/null || true

      - name: Point Godot at the Android SDK + JDK 17
        script: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK" || { echo "FATAL: no Android SDK on this builder"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$CM_ENV"
          JH=$(/usr/libexec/java_home -v 17 2>/dev/null || echo "${JAVA_HOME:-}")
          test -n "$JH" || { echo "FATAL: no JDK 17 and no JAVA_HOME"; exit 1; }
          echo "JAVA_HOME=$JH" >> "$CM_ENV"
          DIR="$HOME/Library/Application Support/Godot"
          mkdir -p "$DIR"
          for ES in "$DIR/editor_settings-4.tres" "$DIR/editor_settings-4.6.tres"; do
            {
              printf '%s\n' '[gd_resource type="EditorSettings" format=3]'
              printf '\n'
              printf '%s\n' '[resource]'
              printf 'export/android/android_sdk_path = "%s"\n' "$SDK"
              printf 'export/android/java_sdk_path = "%s"\n' "$JH"
            } > "$ES"
          done

      - name: Wire the upload keystore
        script: |
          set -e
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "FATAL: no keystore. Codemagic > Code signing identities > Android keystores."
            exit 1
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$CM_KEYSTORE_PATH" >> "$CM_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$CM_KEY_ALIAS" >> "$CM_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$CM_KEY_PASSWORD" >> "$CM_ENV"
          echo "--- upload key wired (alias: $CM_KEY_ALIAS)"

      - name: Set version code + import resources
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          sed -i '' "s|^version/code=.*|version/code=$PROJECT_BUILD_NUMBER|" export_presets.cfg
          grep -E "^(version/code|version/name|package/unique_name)=" export_presets.cfg
          # (the first import lets the AdMob plugin download its Android binaries)
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --import || true
          for f in addons/admob/android/bin/ads/libs/poing-godot-admob-ads-release.aar \
                   addons/admob/android/bin/ads/libs/poing-godot-admob-core-release.aar \
                   addons/godot-iap/android/GodotIap.release.aar; do
            test -f "$f" && echo "    OK      $f" || { echo "FATAL: missing $f"; exit 1; }
          done

      - name: Godot export (AAB via Gradle)
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          mkdir -p build
          "$GODOT" --headless --path . --export-release "$PRESET" "$OUT" > export.log 2>&1 || true
          sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' export.log | tail -120
          # godotengine/godot#100689: an AAB export can report success and write no file.
          test -f "$OUT" || { echo "FATAL: no AAB produced — see export.log above."; exit 1; }

      # An AAB's manifest is protobuf with plain UTF-8 strings, so it can be grepped. A build that
      # failed to link the plugins installs and plays perfectly and earns nothing; fail it here.
      - name: Verify the bundle and the plugins
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "--- AAB size: $(( $(stat -f%z "$OUT") / 1024 / 1024 )) MB"
          unzip -l "$OUT" | awk '/base\/lib\/.*\.so$/ {print $4}' | tee libs.txt
          grep -q 'base/lib/arm64-v8a/' libs.txt || { echo "FATAL: no arm64-v8a libraries"; exit 1; }
          M=$(mktemp)
          unzip -p "$OUT" base/manifest/AndroidManifest.xml > "$M"
          APPID=$(sed -n 's/^general\/android\/app_id="\(.*\)"/\1/p' project.godot)
          : > missing.txt
          while IFS='|' read -r NEEDLE LABEL; do
            if grep -aq "$NEEDLE" "$M"; then echo "    OK      $LABEL"
            else echo "    MISSING $LABEL"; echo "$LABEL" >> missing.txt; fi
          done <<CHECKS
          com.google.android.gms.ads.APPLICATION_ID|AdMob app id declared
          ${APPID:-no-app-id-in-project-godot}|the app id is ours, not Google's test one
          com.google.android.gms.permission.AD_ID|Ad ID permission (the real Mobile Ads SDK merged)
          android.permission.INTERNET|INTERNET permission
          com.android.vending.BILLING|Play Billing permission (GodotIap linked)
          CHECKS
          test ! -s missing.txt || { echo "FATAL: plugins not linked"; exit 1; }
          if grep -aq "_CONFIGURATION_ERROR" "$M"; then
            echo "FATAL: AdMob reported missing libraries:"; grep -ao "[A-Za-z_]*_CONFIGURATION_ERROR" "$M" | sort -u
            exit 1
          fi
          echo "--- bundle verified"

    artifacts:
      - build/*.aab
      - export.log
